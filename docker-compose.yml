services:
  oci-panel:
    build: .
    container_name: oci-panel
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-9528}:9528"
    environment:
      PYTHONUNBUFFERED: "1"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9528/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
